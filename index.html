<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateus - Portfolio for Projects</title>
    <link rel="icon" type="image/png" href="./assets/logo/logo_pi.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

<div id="contact-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 450px;">
        <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
        <h3 data-i18n="contactTitle" style="margin-top: 0;">Vamos conversar?</h3>
        <div style="margin-top: 20px;">
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=mateusdossantoscavalheiro@gmail.com" target="_blank" class="list-item"><i class="fa-solid fa-envelope"></i> <strong>Gmail</strong></a>
            <a href="https://wa.me/5547991814413" target="_blank" class="list-item"><i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> <strong>WhatsApp</strong></a>
            <a href="https://www.linkedin.com/in/mateusdosscavalheiro/" target="_blank" class="list-item"><i class="fa-brands fa-linkedin" style="color: #0A66C2;"></i> <strong>LinkedIn</strong></a>
            <a href="https://www.instagram.com/mattz_cavalheiro/" target="_blank" class="list-item"><i class="fa-brands fa-instagram" style="color: #E1306C;"></i> <strong>Instagram</strong></a>
            <a href="https://github.com/mateusdossantoscavalheiro-sudo" target="_blank" class="list-item"><i class="fa-brands fa-github"></i> <strong>GitHub</strong></a>
        </div>
    </div>
</div>

<div id="lang-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 450px;">
        <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
        <h3 data-i18n="langTitle" style="margin-top: 0; text-align: center;">Selecione o idioma</h3>
        <div class="flag-display-container"><span id="animated-flag" class="fi fi-br big-flag"></span></div>
        <div class="lang-grid">
            <button class="lang-btn" onclick="changeLanguage('pt')"><span class="fi fi-br"></span> Português</button>
            <button class="lang-btn" onclick="changeLanguage('en')"><span class="fi fi-us"></span> English</button>
            <button class="lang-btn" onclick="changeLanguage('es')"><span class="fi fi-es"></span> Español</button>
            <button class="lang-btn" onclick="changeLanguage('de')"><span class="fi fi-de"></span> Deutsch</button>
        </div>
    </div>
</div>

<div id="project-modal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
        <div class="project-grid">
            <div class="project-left">
                <div class="miniature-display" id="modal-media"></div>
                <div style="margin-top: 15px; font-size: 0.8rem; opacity: 0.8; line-height: 1.6;">
                    <p style="margin: 5px 0;"><i class="fa-regular fa-calendar-days"></i> <strong id="label-date"></strong> <span id="modal-date"></span></p>
                    <p style="margin: 5px 0;"><i class="fa-solid fa-check-double"></i> <strong id="label-status"></strong> <span id="modal-status"></span></p>
                    <p style="margin: 5px 0;"><i class="fa-solid fa-laptop-code"></i> <strong id="label-platform"></strong> <span id="modal-platform"></span></p>
                </div>
            </div>
            <div style="width: 1px; background: rgba(128,128,128,0.2);"></div>
            <div class="project-right">
                <h2 id="modal-title" style="margin-top:0; color:var(--header-color);"></h2>
                <p id="modal-desc" style="font-size: 0.9rem; line-height: 1.6; opacity: 0.9;"></p>
                <div style="margin-top: 30px; border-top: 1px solid rgba(128,128,128,0.1); padding-top: 20px;">
                    <p id="label-action" style="font-size: 0.8rem; margin-bottom: 12px; opacity: 0.8;"></p>
                    <div style="display: flex; gap: 10px;">
                        <a id="modal-github" href="#" target="_blank" class="opt-btn"><i class="fa-brands fa-github"></i> GITHUB</a>
                        <a id="modal-pdf" href="#" target="_blank" class="opt-btn"><i class="fa-solid fa-file-pdf"></i> PDF</a>
                        <a id="modal-demo" href="#" target="_blank" class="opt-btn"><i class="fa-solid fa-play"></i> <span id="label-demo">TESTAR</span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div style="display: flex; flex-direction: column; width: 100%;">
    <header class="chat-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i> <span data-i18n="menu"></span></button>
            <div class="logo-wrapper"><img src="./assets/logo/logo_pi.png" id="main-logo" alt="Logo"></div>
            <span data-i18n="headerTitle"></span>
        </div>
        <div class="header-right">
            <button class="header-icon-btn" onclick="openModal('contact-modal')"><i class="fa-solid fa-phone"></i> <span data-i18n="btnContact"></span></button>
            <button class="header-icon-btn" onclick="openModal('lang-modal')"><i class="fa-solid fa-globe"></i></button>
            <button class="header-icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-sun"></i></button>
        </div>
    </header>

    <div class="layout-wrapper">
        <aside class="sidebar collapsed" id="sidebar">
            <h4 style="opacity: 0.5; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 20px; margin-top: 0;" data-i18n="sidebarProjects"></h4>
            <div id="project-list"></div>
        </aside>

        <main class="chat-container">
            <div class="chat-box" id="chat-box"></div>
            <div class="options">
                <button class="opt-btn" onclick="ask('btnSkills')" data-i18n="btnSkills"></button>
                <button class="opt-btn" onclick="toggleSidebar()" data-i18n="btnProjects"></button>
                <button class="opt-btn" onclick="openModal('contact-modal')" data-i18n="btnContact"></button>
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
